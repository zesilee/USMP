# 示例北向 CRD：BusinessVlanNet —— crd2yang 工具的验证输入（C2Y-01/D6）。
# 模拟「网络自动化服务」发布的业务 VLAN 契约；字段约束逐条对齐系统已集成的
# 华为 YANG 模型（snd/ce6866p-yang）：
#   vlan-id     1..4094   ← huawei-vlan typedef vlan-id
#   name        1..31 字符 ← huawei-vlan leaf name (length "1..31")
#   description 1..80 字符 ← huawei-vlan leaf description (length "1..80")
#   vlan-type   common/super ← huawei-vlan typedef vlan-type
#   端口名      1..63 字符 ← huawei-pub-type typedef if-name (length "1..63")
# 仅作 testdata fixture，不进 deploy/crds/、不注册到任何集群。
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: businessvlannets.biz.usmp.io
  annotations:
    usmp.io/yang-revision: "2026-08-04"
    usmp.io/yang-module: usmp-business-vlan-net
    usmp.io/yang-namespace: urn:usmp:yang:usmp-business-vlan-net
    usmp.io/yang-prefix: ubvn
    usmp.io/yang-container: business-vlan-net
    usmp.io/task-name: business-network
spec:
  group: biz.usmp.io
  names:
    kind: BusinessVlanNet
    listKind: BusinessVlanNetList
    plural: businessvlannets
    singular: businessvlannet
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - vlan-id
              properties:
                vlan-id:
                  type: integer
                  minimum: 1
                  maximum: 4094
                  description: 业务 VLAN ID（对齐 huawei-vlan vlan-id，展开到每台设备）。
                name:
                  type: string
                  pattern: "[A-Za-z0-9_-]{1,31}"
                  description: 业务名称（对齐 huawei-vlan name 长度 1..31）。
                description:
                  type: string
                  pattern: ".{1,80}"
                  description: 业务描述（对齐 huawei-vlan description 长度 1..80）。
                vlan-type:
                  type: string
                  enum:
                    - common
                    - super
                  description: VLAN 类型（对齐 huawei-vlan vlan-type 枚举子集）。
                enabled:
                  type: boolean
                  description: 业务使能开关。
                qos:
                  type: object
                  properties:
                    priority:
                      type: integer
                      minimum: 0
                      maximum: 7
                      description: 802.1p 优先级。
                  description: QoS 参数。
                devices:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - ip
                  items:
                    type: object
                    required:
                      - ip
                    properties:
                      ip:
                        type: string
                        pattern: "([0-9]{1,3}\\.){3}[0-9]{1,3}"
                        description: 设备管理 IP（列表主键，与 DeviceStore 一致）。
                      access-ports:
                        type: array
                        items:
                          type: string
                          pattern: ".{1,63}"
                        description: 以 access 方式加入该 VLAN 的接口名（对齐 if-name 长度 1..63）。
                      trunk-ports:
                        type: array
                        items:
                          type: string
                          pattern: ".{1,63}"
                        description: 以 trunk 方式放行该 VLAN 的接口名（对齐 if-name 长度 1..63）。
                  description: 参与打通的设备清单。
              description: 业务 VLAN 打通期望配置。
            status:
              type: object
              description: 由控制器回填的设备真实状态（crd2yang 转换时整体丢弃，BIC-04）。
              properties:
                syncState:
                  type: string
